<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data: blob:;">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>插件 · DeepSeek Harness</title>
  <link rel="stylesheet" href="marketplace.css">
</head>
<body>
  <div class="app-shell" id="appShell">
    <header class="topbar" aria-label="插件管理工具栏">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 15.5c2.7 2.1 6.5 2.5 9.6.9 2.5-1.3 4.1-3.5 4.4-6-.9.4-2 .7-3.1.4.1-1.4-.4-2.9-1.4-4.1-.3 1.4-1.1 2.4-2.4 3.1.1-1.4-.6-2.7-1.9-3.8-1.1 2.1-3 3.3-5.2 3.9-.5 1.8-.4 3.5 0 5.6Zm2.6.5c.4-1.3 1.2-2.4 2.4-3.2 1.7-.9 3.5-.6 4.7.5-1.9 1.6-4.3 2.4-7.1 2.7Z"/></svg></div>
        <div><strong>DeepSeek Harness</strong><span>插件中心</span></div>
      </div>
      <div class="topbar-spacer"></div>
      <button class="icon-button" id="refreshButton" type="button" aria-label="刷新插件列表" title="刷新"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.6-4L4 9"></path><path d="M4 4v5h5"></path><path d="M4 13a8 8 0 0 0 14.6 4L20 15"></path><path d="M20 20v-5h-5"></path></svg></button>
      <button class="icon-button" id="closeButton" type="button" aria-label="关闭插件中心" title="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg></button>
    </header>

    <main class="page-content">
      <section class="page-heading" aria-labelledby="pageTitle">
        <div><span class="eyebrow">EXTENSIONS</span><h1 id="pageTitle">插件</h1><p>为 Agent 增加能力，也可以管理本地已经启用的插件。</p></div>
        <div class="heading-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      </section>

      <div class="content-toolbar">
        <div class="tabs" role="tablist" aria-label="插件来源">
          <button class="tab is-active" id="installedTab" type="button" role="tab" aria-selected="true" aria-controls="installedPanel" data-tab="installed">本地插件</button>
          <button class="tab" id="marketTab" type="button" role="tab" aria-selected="false" aria-controls="marketPanel" data-tab="market">插件市场</button>
        </div>
        <label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.2"></circle><path d="m16 16 4.6 4.6"></path></svg><input id="searchInput" type="search" autocomplete="off" placeholder="搜索插件…" aria-label="搜索插件"><kbd>Ctrl K</kbd></label>
        <button class="refresh-button" id="toolbarRefresh" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.6-4L4 9"></path><path d="M4 4v5h5"></path><path d="M4 13a8 8 0 0 0 14.6 4L20 15"></path><path d="M20 20v-5h-5"></path></svg><span>刷新</span></button>
      </div>

      <section id="installedPanel" class="plugin-panel is-active" role="tabpanel" aria-labelledby="installedTab" data-panel="installed">
        <div class="section-heading"><div><h2>本地插件</h2><p>只显示当前 Harness 工作区能够发现的插件。</p></div><span id="installedMeta" class="section-meta" hidden></span></div>
        <div id="installedList" class="plugin-list" aria-live="polite"><div class="loading-state"><span class="spinner"></span>正在读取本地插件…</div></div>
      </section>

      <section id="marketPanel" class="plugin-panel" role="tabpanel" aria-labelledby="marketTab" data-panel="market" hidden>
        <div class="section-heading"><div><h2>插件市场</h2><p>只安装经过验证的插件；其他项目先查看来源和兼容性。</p></div><span id="marketMeta" class="section-meta" hidden></span></div>
        <div id="marketList" class="plugin-list" aria-live="polite"><div class="empty-state"><strong>输入关键词开始搜索</strong><span>插件市场不会在没有搜索条件时伪造推荐列表。</span></div></div>
      </section>
    </main>

    <footer class="page-footer"><span>插件安装范围受当前 Workspace 和 Harness 权限策略限制。</span><span id="progressStatus" aria-live="polite"></span></footer>
  </div>

  <div class="overlay" id="inspectOverlay" hidden>
    <section class="inspect-dialog" role="dialog" aria-modal="true" aria-labelledby="inspectTitle">
      <div class="dialog-header"><div><span class="eyebrow">PLUGIN DETAILS</span><h2 id="inspectTitle">插件详情</h2></div><button class="icon-button" data-close-inspect type="button" aria-label="关闭详情">×</button></div>
      <div id="inspectBody" class="inspect-body"></div>
      <div class="dialog-footer"><button class="secondary-button" data-close-inspect type="button">关闭</button><button class="primary-button" id="inspectExternal" type="button" hidden>打开项目主页</button></div>
    </section>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  <script src="marketplace-renderer.js"></script>
</body>
</html>
