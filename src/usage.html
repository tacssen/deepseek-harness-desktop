<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usage &amp; Billing</title>
  <style>
    :root { color-scheme: dark; --bg:#0a0e15; --panel:#111824; --line:#253142; --text:#e9eef7; --muted:#8f9bad; --accent:#6da7ff; --good:#42d392; --warn:#e7b85b; }
    * { box-sizing:border-box; } body { margin:0; padding:24px; background:radial-gradient(circle at 90% -10%,#15253b 0,#0a0e15 45%); color:var(--text); font:14px/1.45 "Segoe UI",system-ui,sans-serif; }
    h1 { margin:0; font-size:24px; letter-spacing:-.02em; } h2 { margin:0 0 8px; font-size:14px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); } p { margin:0; color:var(--muted); }
    .head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:20px; } .head-actions { display:flex; gap:8px; }
    button { border:1px solid var(--line); border-radius:7px; color:var(--text); background:#182230; padding:8px 12px; font:inherit; cursor:pointer; } button:hover { border-color:#456287; background:#202e40; } button.primary { background:#2768ba; border-color:#3c83df; } button.danger { color:#ffacac; }
    .balance { border:1px solid #39506b; border-radius:12px; background:linear-gradient(120deg,#12243a,#101a28); padding:16px; display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:16px; } .balance strong { display:block; font-size:18px; margin-top:4px; } .pill { display:inline-flex; border-radius:999px; padding:3px 8px; font-size:12px; background:#293547; color:var(--muted); } .pill.warn { color:var(--warn); background:#3a2d16; }
    .cards { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:18px; } .card { background:rgba(17,24,36,.92); border:1px solid var(--line); border-radius:10px; padding:14px; min-height:116px; } .card .period { color:var(--muted); font-size:12px; } .value { font-size:23px; font-weight:650; margin:5px 0 3px; } .meta { color:var(--muted); font-size:12px; }
    .table-wrap { border:1px solid var(--line); border-radius:10px; overflow:auto; background:rgba(17,24,36,.9); } table { width:100%; border-collapse:collapse; min-width:740px; } th,td { text-align:left; padding:10px 12px; border-bottom:1px solid #1d2735; white-space:nowrap; } th { color:var(--muted); font-size:12px; font-weight:500; } td { font-size:12px; } tr:last-child td { border-bottom:0; } .empty { padding:28px; color:var(--muted); text-align:center; }
    #message { min-height:20px; margin-top:12px; color:var(--muted); } #message.good { color:var(--good); } #message.warn { color:var(--warn); }
    @media (max-width:780px) { .cards { grid-template-columns:repeat(2,minmax(0,1fr)); } .balance { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <header class="head"><div><h1>Usage &amp; Billing</h1><p>本地仅记录真实 API response usage；费用为 Estimated Cost，不代表官方账单。</p></div><div class="head-actions"><button id="refresh">刷新</button><button id="billing" class="primary">打开 DeepSeek Billing</button><button id="close">关闭</button></div></header>
  <section class="balance"><div><span class="pill warn" id="balanceStatus">官方余额接口不可用</span><strong id="balanceMessage">请打开 DeepSeek Billing 页面查看真实余额。</strong></div><p id="paths"></p></section>
  <section class="cards" id="cards"></section>
  <h2>Recent API records</h2>
  <section class="table-wrap"><table><thead><tr><th>时间</th><th>Provider / Model</th><th>Session</th><th>Prompt</th><th>Completion</th><th>Total</th><th>Estimated Cost</th></tr></thead><tbody id="records"></tbody></table><div class="empty" id="empty" hidden>暂无本地 Usage 记录。</div></section>
  <div id="message" aria-live="polite"></div>
  <script src="usage-renderer.js"></script>
</body>
</html>
