name: Windows CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Ensure Electron runtime and license notices
        run: node node_modules/electron/install.js
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run security:scan
      - run: npm test
      - run: npm run build
